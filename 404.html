<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Not found — Redirecting...</title>

  <!-- Meta refresh as a fallback for very old browsers / no-JS (wait 2s to show message briefly) -->
  <meta http-equiv="refresh" content="2;url=https://axiom3d-yt.github.io/spacemouse.html">

  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      color: #222;
    }
    .wrap {
      text-align: center;
      max-width: 720px;
      padding: 36px;
    }
    h1 { font-size: 64px; margin: 0 0 8px; }
    p { margin: 8px 0 0; color: #555; }
    a.button {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      background: #111;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-weight: 600;
    }
    small { display:block; margin-top:12px; color:#888; }
  </style>

  <script>
    // Redirect after 2 seconds to the desired fallback.
    // Change fallbackUrl if you want a different page.
    (function () {
      var fallbackUrl = "https://axiom3d-yt.github.io/spacemouse.html";
      // Wait 2000ms (2s) before redirecting so the message/button are visible briefly
      setTimeout(function () {
        try {
          // Use replace() so the 404 page isn't added to history
          window.location.replace(fallbackUrl);
        } catch (e) {
          // If replace fails for some reason, set location.href
          window.location.href = fallbackUrl;
        }
      }, 2000);
    })();
  </script>
</head>
<body>
  <div class="wrap">
    <h1>404</h1>
    <p>Page not found — redirecting you now.</p>
    <a class="button" href="https://axiom3d-yt.github.io/spacemouse.html">Go to Spacemouse page</a>
    <small>If you are not redirected automatically, click the link above.</small>
  </div>
</body>
</html>
